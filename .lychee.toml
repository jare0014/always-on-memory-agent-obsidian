# Lychee link checker configuration

# Exclude local addresses, ports, and internal endpoints
exclude = [
  '^http://localhost',
  '^http://127.0.0.1',
  '^https://localhost',
  '^https://127.0.0.1',
]

exclude_mail = true
max_concurrency = 4
timeout = 10
max_retries = 3

# Accept 200, 204, 206, 301, 302, 403 (for GitHub rate-limited endpoints)
accept = [200, 204, 206, 301, 302, 403]
